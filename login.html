<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-image: url('https://circontrol.com/wp-content/uploads/2023/10/180125-Circontrol-BAIXA-80-1.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: white;
            width: 320px;
        }

        .login-box h2 { margin-bottom: 20px; }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .login-box button:hover { background: #1e3c72; }

        a { color: lightblue; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p style="margin-top:10px;">
        New user? <a href="signup.html">Sign Up</a>
    </p>
</div>

<script>
async function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    let savedUser = localStorage.getItem("username");
    let savedPass = localStorage.getItem("password");

    // DEFAULT LOGIN
    if (user === "Purvi Jain" && pass === "Purvi02") {
        localStorage.setItem("isLoggedIn", "true");
        window.location.href = "index.html";
        return;
    }

    // LOCAL STORAGE LOGIN
    if (user === savedUser && pass === savedPass) {
        localStorage.setItem("isLoggedIn", "true");
        window.location.href = "index.html";
        return;
    }

    // DATABASE LOGIN
    try {
        let res = await fetch("http://localhost:5000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, password: pass })
        });

        let data = await res.json();

        if (data.success) {
            localStorage.setItem("isLoggedIn", "true");
            window.location.href = "index.html";
        } else {
            alert("Wrong credentials");
        }

    } catch (err) {
        alert("Server error");
    }
}

document.getElementById("username").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("password").focus();
});

document.getElementById("password").addEventListener("keydown", function(e) {
    if (e.key === "Enter") login();
});
</script>

</body>
</html>
